name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: make test
      - run: uv run mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv build
      - run: uv run twine check dist/*
      - run: uv venv --python 3.12 /tmp/language-model-wheel-smoke
      - run: uv pip install --python /tmp/language-model-wheel-smoke/bin/python dist/*.whl
      - run: /tmp/language-model-wheel-smoke/bin/lm --version
      - run: /tmp/language-model-wheel-smoke/bin/lm list-models
      - run: test -f /tmp/language-model-wheel-smoke/share/pytorch-language-modeling-lab/configs/char_tiny.yaml
