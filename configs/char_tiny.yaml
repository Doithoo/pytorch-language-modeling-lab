data:
  corpus_dir: data/raw
  processed_dir: data/processed
  manifest_dir: data/manifests
  dataset_name: tiny_corpus
  tokenizer_name: char
  context_length: 128
  stride: 128
  split_ratios: [0.9, 0.05, 0.05]
  seed: 42
  num_workers: 0
  window_mode: document

tokenizer:
  name: char
  vocab_size: null
  min_frequency: 1
  special_tokens: ["<pad>", "<bos>", "<eos>", "<unk>"]

model:
  name: transformer_decoder
  vocab_size: null
  context_length: 128
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  dropout: 0.1
  positional_encoding: learned
  tie_embeddings: true

train:
  max_steps: 5000
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 100
  max_grad_norm: 1.0
  amp: false
  eval_interval: 250
  eval_batches: 50
  save_interval: 250
  log_interval: 10
  best_metric: val_loss

generation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 40
  top_p: 0.95
  use_cache: true
  seed: 42

runtime:
  device: auto
  seed: 42
  output_dir: artifacts
  run_name: char-tiny-transformer
