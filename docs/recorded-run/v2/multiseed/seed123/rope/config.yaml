data:
  corpus_dir: /kaggle/working/data/raw
  processed_dir: /kaggle/working/data/processed
  manifest_dir: /kaggle/working/data/manifests
  dataset_name: tiny_shakespeare_seed123
  tokenizer_name: char
  context_length: 256
  stride: 256
  split_ratios:
  - 0.9
  - 0.05
  - 0.05
  seed: 123
  num_workers: 2
  window_mode: document
  split_strategy: document_count
  group_by_source: false
tokenizer:
  name: char
  vocab_size: 69
  min_frequency: 1
  special_tokens:
  - <pad>
  - <bos>
  - <eos>
  - <unk>
model:
  name: transformer_decoder
  vocab_size: 69
  context_length: 256
  n_layers: 6
  n_heads: 6
  d_model: 384
  d_ff: 1536
  dropout: 0.1
  positional_encoding: rotary
  tie_embeddings: true
  attention_implementation: sdpa
train:
  max_steps: 5000
  batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 200
  max_grad_norm: 1.0
  amp: true
  eval_interval: 250
  eval_batches: 50
  save_interval: 250
  log_interval: 25
  best_metric: val_loss
  beta1: 0.9
  beta2: 0.95
generation:
  max_new_tokens: 400
  temperature: 0.8
  top_k: 40
  top_p: 0.95
  use_cache: true
  seed: 123
  prompts:
  - 'The '
runtime:
  device: cuda
  seed: 123
  output_dir: /kaggle/working/artifacts
  run_name: kaggle-char-small-rope-seed123
  log_level: info
  deterministic: true
