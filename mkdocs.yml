site_name: PyTorch Language Modeling Project
site_description: A small, reproducible PyTorch causal language modeling project
repo_url: https://github.com/Doithoo/pytorch-language-modeling-lab
repo_name: Doithoo/pytorch-language-modeling-lab
docs_dir: docs
site_dir: build/site
strict: true
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true
nav:
  - Home: README.md
  - 中文首页: README.zh-CN.md
