[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-language-modeling-lab"
version = "0.2.0"
description = "An educational, reproducible PyTorch causal language modeling lab"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yashowhoo" }]
keywords = ["pytorch", "language-modeling", "transformer", "gpt", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0,<3",
    "numpy>=1.24,<3",
    "pyyaml>=6,<7",
    "tokenizers>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "mypy>=1.15,<2",
    "types-PyYAML>=6,<7",
    "tomli>=2,<3; python_version < '3.11'",
    "build>=1.2,<2",
    "matplotlib>=3.8,<4",
    "pre-commit>=3,<5",
    "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/Doithoo/pytorch-language-modeling-lab"
Repository = "https://github.com/Doithoo/pytorch-language-modeling-lab"
Documentation = "https://github.com/Doithoo/pytorch-language-modeling-lab#readme"
Issues = "https://github.com/Doithoo/pytorch-language-modeling-lab/issues"

[project.scripts]
lm = "language_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
language_model = ["py.typed"]

[tool.setuptools.data-files]
"share/pytorch-language-modeling-lab/configs" = [
    "configs/bigram_tiny.yaml",
    "configs/bpe_tiny.yaml",
    "configs/char_tiny.yaml",
    "configs/kaggle_char_small.yaml",
    "configs/kaggle_char_small_sdpa.yaml",
    "configs/kaggle_char_small_rope.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]
extend-exclude = ["docs", "README.md", "README.zh-CN.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "examples"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
